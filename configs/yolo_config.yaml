# Cấu hình huấn luyện YOLOv8n-seg — Giai đoạn 2
# Đồ án: Đo kích thước bàn chân và tư vấn size giày
#
# Phần dataset (path/train/val/test/names) là định dạng chuẩn của Ultralytics.
# Siêu tham số nằm trong `train_args` để không trùng khóa `val` của dataset.
# train.py đọc file này, đổi `path` thành đường dẫn tuyệt đối lúc chạy và truyền train_args cho YOLO.

# ── Dataset ──────────────────────────────────────────────────────────────────
# Sử dụng đường dẫn tương đối từ thư mục gốc dự án
path: data/yolo_dataset
train: images/train
val:   images/valid
test:  images/test

# ── Classes ──────────────────────────────────────────────────────────────────
nc: 2
names:
  0: foot
  1: card

# ── Model ────────────────────────────────────────────────────────────────────
model: models/yolov8n-seg.pt

# ── Inference (pipeline đo: python main.py --method yolo) ───────────────────
infer:
  weights: models/trained/yolov8n_seg_foot/weights/best.pt
  conf: 0.25            # Mỗi lớp chỉ giữ 1 đối tượng có conf cao nhất nên ngưỡng này không cần cao
  iou: 0.45
  imgsz: 640
  retina_masks: true    # Mask độ phân giải ảnh gốc: cạnh thẻ/chân chính xác hơn khi đo mm

# ── Ảnh đầu vào ──────────────────────────────────────────────────────────────
# Ảnh lớn hơn khung này (mặc định Full HD, tối đa ~2 MP; máy nào cũng chụp được) bị thu nhỏ trước khi xử lý (giữ tỉ lệ, không
# phóng to). Ảnh huấn luyện (960x1280) nằm trong khung này nên số đo không đổi; ảnh 12 MP của điện thoại được thu nhỏ về ~1080x1440.
input:
  max_long_side: 1920
  max_short_side: 1080

# ── Hiệu chỉnh độ cao (chỉ áp dụng cho --method yolo) ───────────────────────
# Thẻ nằm trên sàn, mu bàn chân/cổ chân cao hơn nên bị phóng đại D / (D - h), D = khoảng cách máy-mặt thẻ.
# D = (focal_ratio x cạnh dài ảnh) x 85,6 mm / cạnh dài thẻ trong ảnh (px).
# h_length_cm, h_width_cm là chiều cao hiệu dụng tìm được trên train+valid (người test không tham gia),
# nên gắn với focal_ratio: đổi focal_ratio (hoặc loại điện thoại khác) thì phải fit lại cả ba.
measure:
  # true: từ chối đo (không trả số cm) khi không thấy gót; ảnh trả về error_message để người dùng chụp lại.
  # false: vẫn đo (chỉ dùng khi nghiên cứu, ví dụ evaluate --include-hidden).
  require_heel: true
  height_correction:
    enabled: true
    focal_ratio: 0.72     # Tiêu cự px / cạnh dài ảnh (điện thoại ~26 mm tương đương)
    h_length_cm: 2.95
    h_width_cm: 3.9

# ── Mô hình chiều dài (chỉ áp dụng cho --method yolo) ───────────────────────
# Hồi quy Ridge học từ số đo thật (data/yolo_dataset/subjects_clean.csv) trên ảnh train+valid. Đầu vào là các đặc trưng mask
# và cỡ thẻ (doan.LENGTH_FEATURES). Huấn luyện: python -m src.yolo_y8.train --fit-length. Chưa có file thì dùng số đo mask
# đã hiệu chỉnh độ cao. File nằm trong models/trained/ nên không commit.
  length_model:
    enabled: true
    path: models/trained/length_model.json

# ── Hyperparameters ──────────────────────────────────────────────────────────
train_args:
  epochs: 100
  patience: 30          # Early stopping patience
  batch: 16             # -1 để auto
  imgsz: 640
  optimizer: AdamW
  lr0: 0.001            # Learning rate khởi đầu (AdamW; 0.01 là mức của SGD, quá cao khi fine-tune)
  lrf: 0.01             # Final lr = lr0 * lrf
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  # Loss weights
  box: 7.5
  cls: 0.5
  dfl: 1.5

  # Data Augmentation
  hsv_h: 0.015          # HSV Hue augmentation
  hsv_s: 0.7            # HSV Saturation augmentation
  hsv_v: 0.4            # HSV Value augmentation
  degrees: 10.0         # Rotation (+/- degrees)
  translate: 0.1        # Translation (+/- fraction)
  scale: 0.5            # Scale (+/- gain)
  shear: 2.0            # Shear (+/- degrees)
  perspective: 0.0      # Perspective (+/- fraction)
  flipud: 0.2           # Flip up-down probability
  fliplr: 0.5           # Flip left-right probability
  mosaic: 1.0           # Mosaic augmentation
  mixup: 0.0            # Mixup augmentation
  copy_paste: 0.0       # Copy-paste augmentation (tốt cho segmentation)

  # Output (đường dẫn tương đối từ gốc dự án)
  project: models/trained
  name: yolov8n_seg_foot
  save: true
  save_period: 10       # Lưu checkpoint mỗi N epoch
  plots: true
  val: true
  verbose: true
